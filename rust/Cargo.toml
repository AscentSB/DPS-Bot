[workspace]
resolver = "2"
members = ["crates/core", "crates/calc", "crates/skyblock", "crates/bot"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "1.0.0"

[workspace.dependencies]
dps-core = { path = "crates/core" }
dps-calc = { path = "crates/calc" }
dps-skyblock = { path = "crates/skyblock" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
rustc-hash = "2"
rayon = "1"
regex = "1"
parking_lot = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync", "signal", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "json"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
base64 = "0.22"
hex = "0.4"
ed25519-dalek = "2"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
twilight-gateway = "0.16"
twilight-http = "0.16"
twilight-model = "0.16"
mimalloc = { version = "0.1", default-features = false }
dotenvy = "0.15"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = "line-tables-only"

# Parity tests run whole plans; keep test builds reasonably fast.
[profile.test]
opt-level = 2

[profile.dev]
opt-level = 1
